---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather installed package facts.
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert the al-agent package is installed.
      ansible.builtin.assert:
        that:
          - "'al-agent' in ansible_facts.packages"
        fail_msg: al-agent package is not installed.

    - name: Stat the al-agent binary.
      ansible.builtin.stat:
        path: /var/alertlogic/lib/agent/bin/al-agent
      register: al_agent_bin

    - name: Assert the al-agent binary is installed and executable.
      ansible.builtin.assert:
        that:
          - al_agent_bin.stat.exists
          - al_agent_bin.stat.mode == '0755'
        fail_msg: >-
          /var/alertlogic/lib/agent/bin/al-agent is missing or does not
          have mode 0755.
