---
- name: Test for rsyslog being installed.
  ansible.builtin.stat:
    path: /etc/rsyslog.conf
  register: rsyslog_init
  tags:
    - rsyslog

- name: Test for syslog-ng being installed.
  ansible.builtin.stat:
    path: /etc/init.d/syslog-ng
  register: syslog_ng_init
  tags:
    - syslog_ng

- name: Include rsyslog configuration when rsyslog is used.
  ansible.builtin.include_tasks: _rsyslog.yml
  when: rsyslog_init.stat.exists
  tags:
    - rsyslog
    - configure_al_agent_syslog

- name: Include syslog-ng configuration when syslog-ng is used.
  ansible.builtin.include_tasks: _syslog_ng.yml
  when: syslog_ng_init.stat.exists
  tags:
    - syslog_ng
    - configure_al_agent_syslog
